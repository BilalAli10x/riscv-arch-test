# SPDX-License-Identifier: Apache-2.0
# CI configuration for CVA6 ACT configs (cv32a65x, …)

ci_enabled: true
# Tune as failures are triaged (parallel Verilator OOM is a runtime concern, not CI yaml).
# cv32a65x/cv32a60x: Sm excluded (SoftwareInterruptEn=0); ExceptionsSm/ExceptionsZc Sail trap-loops (mtval=0).
# cv64a6_imafdc_sv39: Sm included (SoftwareInterruptEn=1); Sdtrig* excluded (Sdtrig=0); PMPSm excluded (UDB NUM_PMP_ENTRIES=0).
exclude_extensions: "Sm,PMPSm,ExceptionsSm,ExceptionsZc,SdtrigSm,SdtrigS,SdtrigU,Smstateen"
apt_packages: "autoconf flex bison help2man libfl-dev ccache device-tree-compiler"
install_script: ".github/scripts/install-cva6.sh"
setup_script: ".github/scripts/setup-cva6.sh"
